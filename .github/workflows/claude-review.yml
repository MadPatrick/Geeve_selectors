# Code review door Claude bij elke pull request (anthropics/claude-code-action).
# Nodig: repository-secret CLAUDE_CODE_OAUTH_TOKEN (maak aan met `claude setup-token`, of installeer via
# `/install-github-app` in Claude Code). Zonder dat secret slaat deze workflow de review netjes over.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Controleer of het secret er is
        id: secret
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN ontbreekt, review overgeslagen."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.secret.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review deze pull request en schrijf in het Nederlands. Volg de afspraken in CLAUDE.md en docs/HERGEBRUIK-SHARED.md.
            Let vooral op:
            - fouten en randgevallen in de logica;
            - veiligheid: SQL-injectie (sqlsrv-queries met parameters), XSS (escapen van uitvoer), CSRF (shared/csrf.php),
              toegang via tileApiGuard()/accessApiGuard(), en geen wachtwoorden of inloggegevens in de code;
            - gebruik van de gedeelde onderdelen (shared/head.php, shared/paths.php, shared/printen.php, tokens.css,
              --btn-*-variabelen) in plaats van eigen kopieen;
            - browsercompatibiliteit (Chrome/Firefox/Edge van ~2020), geen mb_*-functies;
            - of het versienummer in version.php is opgehoogd.
            Geef korte, concrete punten. Gebruik inline comments voor regels in de code en een korte samenvatting als
            algemene PR-comment. Meld geen opmaakkwesties die de checks al vangen.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
